# ── Smart Robot Project ── Docker Compose ──
# Levanta todo con: docker compose up -d
#
# Requiere .env en agent/ con GOOGLE_API_KEY

services:
  robot-monitor:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: smart-robot-monitor:latest
    container_name: robot-monitor
    network_mode: host
    env_file:
      - ./agent/.env
    environment:
      - ROBOT_IP=${ROBOT_IP:-192.168.4.1}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - PORT=8080
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
